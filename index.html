<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>السبورة الحية</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f5f6fa; overflow: hidden; direction: rtl;
  }

  /* ===== صفحة الدخول ===== */
  #loginPage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    z-index: 1000; padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .login-card h1 { margin: 0 0 12px; font-size: 28px; color: #2d3436; }
  .login-card p { margin: 0 0 28px; color: #636e72; font-size: 15px; line-height: 1.6; }
  .login-card input {
    width: 100%; padding: 16px 18px; border: 2px solid #dfe6e9; border-radius: 12px;
    font-size: 16px; outline: none; transition: border 0.2s; text-align: center;
    direction: rtl; background: #fafbfc;
  }
  .login-card input:focus { border-color: #667eea; background: #fff; }
  .login-card button {
    width: 100%; margin-top: 18px; padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 17px;
    font-weight: 600; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
  }
  .login-card button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.5); }
  .login-card button:active { transform: translateY(0); }
  .login-card button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  #loginError { color: #e74c3c; font-size: 14px; margin-top: 14px; min-height: 20px; }

  /* ===== السبورة ===== */
  #boardPage { position: fixed; inset: 0; display: none; background: #fff; }
  #boardPage.active { display: block; }

  #canvasWrap { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }
  #baseCanvas { background: #fff; }
  #drawCanvas { background: transparent; }

  #toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border-radius: 16px; padding: 8px 10px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    z-index: 100; max-width: calc(100vw - 20px); justify-content: center;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .tool-btn {
    width: 42px; height: 42px; border: none; border-radius: 10px; background: #f1f3f7;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.15s; color: #2d3436; flex-shrink: 0;
  }
  .tool-btn:hover { background: #e3e7ef; }
  .tool-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .tool-btn:active { transform: scale(0.94); }
  .tool-sep { width: 1px; height: 28px; background: #dfe6e9; margin: 0 2px; }

  #colorPicker { width: 42px; height: 42px; border: none; border-radius: 10px; cursor: pointer; padding: 0; background: none; }
  #sizeSlider { width: 90px; accent-color: #667eea; }

  #statusBar {
    position: fixed; bottom: 12px; right: 12px; background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px); border-radius: 12px; padding: 8px 14px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: #2d3436;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12); z-index: 100; border: 1px solid rgba(0,0,0,0.06);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b2bec3; transition: background 0.3s; }
  .dot.online { background: #00b894; box-shadow: 0 0 8px #00b894; }
  .dot.connecting { background: #fdcb6e; animation: pulse 1s infinite; }
  .dot.offline { background: #e74c3c; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  #userCount { font-weight: 600; }

  #logoutBtn {
    position: fixed; bottom: 12px; left: 12px; z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; padding: 10px 16px;
    color: #e74c3c; font-weight: 600; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12); transition: all 0.15s;
  }
  #logoutBtn:hover { background: #fff; transform: translateY(-1px); }

  #textInputModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  #textInputModal.active { display: flex; }
  .text-modal-card {
    background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .text-modal-card h3 { margin: 0 0 16px; color: #2d3436; font-size: 18px; }
  .text-modal-card input {
    width: 100%; padding: 14px; border: 2px solid #dfe6e9; border-radius: 10px;
    font-size: 16px; outline: none; direction: rtl;
  }
  .text-modal-card input:focus { border-color: #667eea; }
  .text-modal-card .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .text-modal-card .btn-row button {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  #textConfirm { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  #textCancel { background: #f1f3f7; color: #2d3436; }

  @media (max-width: 600px) {
    #toolbar { padding: 6px 8px; gap: 4px; border-radius: 14px; }
    .tool-btn { width: 38px; height: 38px; font-size: 16px; border-radius: 9px; }
    #sizeSlider { width: 70px; }
    #colorPicker { width: 38px; height: 38px; }
    .tool-sep { height: 24px; }
    #statusBar { font-size: 12px; padding: 6px 10px; }
    #logoutBtn { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-card">
    <h1>السبورة الحية</h1>
    <p>سبورة بيضاء مشتركة في الوقت الفعلي. أدخل كلمة مرور السبورة للانضمام إلى الجلسة. كل كلمة مرور تفتح سبورة مستقلة.</p>
    <input type="password" id="roomPassword" placeholder="كلمة مرور السبورة" autocomplete="off" />
    <button id="loginBtn">دخول</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="boardPage">
  <div id="canvasWrap">
    <canvas id="baseCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div id="toolbar">
    <button class="tool-btn active" data-tool="pen" title="قلم">✏️</button>
    <button class="tool-btn" data-tool="eraser" title="ممحاة">🧽</button>
    <div class="tool-sep"></div>
    <input type="color" id="colorPicker" value="#2d3436" title="لون القلم" />
    <input type="range" id="sizeSlider" min="1" max="40" value="3" title="حجم القلم" />
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="line" title="خط مستقيم">📏</button>
    <button class="tool-btn" data-tool="rect" title="مستطيل">▭</button>
    <button class="tool-btn" data-tool="circle" title="دائرة">⭕</button>
    <button class="tool-btn" data-tool="arrow" title="سهم">➡️</button>
    <button class="tool-btn" data-tool="text" title="كتابة نص">🔤</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="undoBtn" title="تراجع">↩️</button>
    <button class="tool-btn" id="clearBtn" title="مسح الكل">🗑️</button>
    <button class="tool-btn" id="saveBtn" title="تحميل PNG">💾</button>
  </div>

  <div id="statusBar">
    <span class="dot" id="connDot"></span>
    <span id="connText">جاري الاتصال...</span>
    <span class="tool-sep"></span>
    <span>👥 <span id="userCount">0</span></span>
  </div>

  <button id="logoutBtn">خروج</button>
</div>

<div id="textInputModal">
  <div class="text-modal-card">
    <h3>أدخل النص</h3>
    <input type="text" id="textInputField" placeholder="اكتب هنا..." />
    <div class="btn-row">
      <button id="textConfirm">إضافة</button>
      <button id="textCancel">إلغاء</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, set, onValue, push, remove, onDisconnect,
  serverTimestamp, get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== إعدادات Firebase (مشروعك) ======
const firebaseConfig = {
  apiKey: "AIzaSyCQ_mi4RCmP5z86fhdM0xlguisPemXFqJA",
  authDomain: "chatahs-2007.firebaseapp.com",
  databaseURL: "https://chatahs-2007-default-rtdb.firebaseio.com",
  projectId: "chatahs-2007",
  storageBucket: "chatahs-2007.firebasestorage.app",
  messagingSenderId: "901444746249",
  appId: "1:901444746249:web:c7976f39f6ba21c8f88cd8"
};
// ==========================================

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const $ = (id) => document.getElementById(id);
const loginPage = $('loginPage');
const boardPage = $('boardPage');
const roomPasswordInput = $('roomPassword');
const loginBtn = $('loginBtn');
const loginError = $('loginError');
const logoutBtn = $('logoutBtn');
const connDot = $('connDot');
const connText = $('connText');
const userCountEl = $('userCount');

const baseCanvas = $('baseCanvas');
const drawCanvas = $('drawCanvas');
const baseCtx = baseCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

let currentRoom = null;
let userId = 'u_' + Math.random().toString(36).slice(2, 10);
let currentTool = 'pen';
let currentColor = '#2d3436';
let currentSize = 3;
let isDrawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let currentPath = [];
let shapes = [];
let unsubShapes = null;
let unsubPresence = null;
let presenceRef = null;
let roomShapesRef = null;
let textModalResolve = null;
let pendingTextPos = null;

function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  for (const c of [baseCanvas, drawCanvas]) {
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  redrawAll();
}
window.addEventListener('resize', resizeCanvases);

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
}
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});
$('colorPicker').addEventListener('input', (e) => { currentColor = e.target.value; });
$('sizeSlider').addEventListener('input', (e) => { currentSize = parseInt(e.target.value, 10); });

function drawShape(ctx, shape) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = shape.color;
  ctx.fillStyle = shape.color;
  ctx.lineWidth = shape.size;

  if (shape.tool === 'pen') {
    if (!shape.points || shape.points.length < 2) { ctx.restore(); return; }
    ctx.beginPath();
    ctx.moveTo(shape.points[0].x, shape.points[0].y);
    for (let i = 1; i < shape.points.length; i++) {
      ctx.lineTo(shape.points[i].x, shape.points[i].y);
    }
    ctx.stroke();
  } else if (shape.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = shape.size * 4;
    if (!shape.points || shape.points.length < 2) { ctx.restore(); return; }
    ctx.beginPath();
    ctx.moveTo(shape.points[0].x, shape.points[0].y);
    for (let i = 1; i < shape.points.length; i++) {
      ctx.lineTo(shape.points[i].x, shape.points[i].y);
    }
    ctx.stroke();
  } else if (shape.tool === 'line') {
    ctx.beginPath();
    ctx.moveTo(shape.x1, shape.y1);
    ctx.lineTo(shape.x2, shape.y2);
    ctx.stroke();
  } else if (shape.tool === 'rect') {
    ctx.beginPath();
    ctx.rect(shape.x1, shape.y1, shape.x2 - shape.x1, shape.y2 - shape.y1);
    ctx.stroke();
  } else if (shape.tool === 'circle') {
    const cx = (shape.x1 + shape.x2) / 2;
    const cy = (shape.y1 + shape.y2) / 2;
    const rx = Math.abs(shape.x2 - shape.x1) / 2;
    const ry = Math.abs(shape.y2 - shape.y1) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else if (shape.tool === 'arrow') {
    const x1 = shape.x1, y1 = shape.y1, x2 = shape.x2, y2 = shape.y2;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = Math.max(12, shape.size * 4);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 7), y2 - headLen * Math.sin(angle - Math.PI / 7));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 7), y2 - headLen * Math.sin(angle + Math.PI / 7));
    ctx.closePath();
    ctx.fill();
  } else if (shape.tool === 'text') {
    ctx.font = `${Math.max(16, shape.size * 6)}px 'Segoe UI', Tahoma, sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(shape.text, shape.x1, shape.y1);
  }
  ctx.restore();
}

function redrawAll() {
  baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
  for (const s of shapes) drawShape(baseCtx, s);
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}

function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  if (e.touches && e.touches.length) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function pointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const pos = getPos(e);
  isDrawing = true;
  startX = pos.x; startY = pos.y;
  lastX = pos.x; lastY = pos.y;
  if (currentTool === 'pen' || currentTool === 'eraser') {
    currentPath = [{ x: pos.x, y: pos.y }];
  }
}

function pointerMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPos(e);
  if (currentTool === 'pen' || currentTool === 'eraser') {
    currentPath.push({ x: pos.x, y: pos.y });
    drawCtx.save();
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    if (currentTool === 'eraser') {
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.lineWidth = currentSize * 4;
    } else {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = currentColor;
      drawCtx.lineWidth = currentSize;
    }
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();
    drawCtx.restore();
    lastX = pos.x; lastY = pos.y;
  } else {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    drawShape(drawCtx, {
      tool: currentTool, color: currentColor, size: currentSize,
      x1: startX, y1: startY, x2: pos.x, y2: pos.y
    });
  }
}

function pointerUp(e) {
  if (!isDrawing) return;
  e.preventDefault();
  isDrawing = false;
  const pos = getPos(e);
  let shape = null;
  if (currentTool === 'pen' || currentTool === 'eraser') {
    if (currentPath.length < 2) { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); currentPath = []; return; }
    shape = { tool: currentTool, color: currentColor, size: currentSize, points: currentPath };
    currentPath = [];
  } else if (currentTool === 'text') {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    pendingTextPos = { x: startX, y: startY };
    openTextModal();
    return;
  } else {
    const dx = pos.x - startX, dy = pos.y - startY;
    if (Math.abs(dx) < 3 && Math.abs(dy) < 3) {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      return;
    }
    shape = {
      tool: currentTool, color: currentColor, size: currentSize,
      x1: startX, y1: startY, x2: pos.x, y2: pos.y
    };
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }
  if (shape) emitShape(shape);
}

drawCanvas.addEventListener('mousedown', pointerDown);
drawCanvas.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
drawCanvas.addEventListener('touchstart', pointerDown, { passive: false });
drawCanvas.addEventListener('touchmove', pointerMove, { passive: false });
drawCanvas.addEventListener('touchend', pointerUp, { passive: false });
drawCanvas.addEventListener('touchcancel', pointerUp, { passive: false });

function openTextModal() {
  const modal = $('textInputModal');
  const field = $('textInputField');
  field.value = '';
  modal.classList.add('active');
  setTimeout(() => field.focus(), 50);
  textModalResolve = (text) => {
    modal.classList.remove('active');
    if (text && pendingTextPos) {
      emitShape({
        tool: 'text', color: currentColor, size: currentSize,
        x1: pendingTextPos.x, y1: pendingTextPos.y, text
      });
    }
    pendingTextPos = null;
  };
}
$('textConfirm').addEventListener('click', () => {
  if (textModalResolve) textModalResolve($('textInputField').value.trim());
});
$('textCancel').addEventListener('click', () => {
  if (textModalResolve) textModalResolve(null);
});
$('textInputField').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); if (textModalResolve) textModalResolve($('textInputField').value.trim()); }
});

function emitShape(shape) {
  if (!roomShapesRef) return;
  const newRef = push(roomShapesRef);
  set(newRef, { ...shape, ts: serverTimestamp(), by: userId });
}

function subscribeRoom(roomKey) {
  roomShapesRef = ref(db, 'rooms/' + roomKey + '/shapes');
  presenceRef = ref(db, 'rooms/' + roomKey + '/presence');

  get(roomShapesRef).then((snap) => {
    const val = snap.val() || {};
    const arr = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    shapes = arr.map(s => { const { ts, by, ...rest } = s; return rest; });
    redrawAll();
  });

  unsubShapes = onValue(roomShapesRef, (snap) => {
    const val = snap.val() || {};
    const arr = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const newShapes = arr.map(s => { const { ts, by, ...rest } = s; return rest; });
    if (JSON.stringify(newShapes) !== JSON.stringify(shapes)) {
      shapes = newShapes;
      redrawAll();
    }
  });

  const myPresenceRef = ref(db, 'rooms/' + roomKey + '/presence/' + userId);
  set(myPresenceRef, { online: true, ts: serverTimestamp() });
  onDisconnect(myPresenceRef).remove();

  unsubPresence = onValue(presenceRef, (snap) => {
    const val = snap.val() || {};
    let count = 0;
    for (const k in val) if (val[k] && val[k].online) count++;
    userCountEl.textContent = count;
  });

  const connectedRef = ref(db, '.info/connected');
  onValue(connectedRef, (snap) => {
    if (snap.val() === true) {
      connDot.className = 'dot online';
      connText.textContent = 'متصل';
      set(myPresenceRef, { online: true, ts: serverTimestamp() });
      onDisconnect(myPresenceRef).remove();
    } else {
      connDot.className = 'dot connecting';
      connText.textContent = 'جاري إعادة الاتصال...';
    }
  });
}

$('undoBtn').addEventListener('click', () => {
  if (!roomShapesRef) return;
  get(roomShapesRef).then((snap) => {
    const val = snap.val() || {};
    const entries = Object.entries(val).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
    if (entries.length === 0) return;
    const lastKey = entries[entries.length - 1][0];
    remove(ref(db, 'rooms/' + currentRoom + '/shapes/' + lastKey));
  });
});

$('clearBtn').addEventListener('click', () => {
  if (!roomShapesRef) return;
  if (!confirm('هل تريد مسح السبورة بالكامل؟')) return;
  shapes = [];
  redrawAll();
  set(roomShapesRef, null);
});

$('saveBtn').addEventListener('click', () => {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const tmp = document.createElement('canvas');
  tmp.width = Math.floor(w * dpr);
  tmp.height = Math.floor(h * dpr);
  const tctx = tmp.getContext('2d');
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.fillStyle = '#fff';
  tctx.fillRect(0, 0, w, h);
  tctx.drawImage(baseCanvas, 0, 0, w, h);
  tctx.drawImage(drawCanvas, 0, 0, w, h);
  const link = document.createElement('a');
  link.download = 'board-' + Date.now() + '.png';
  link.href = tmp.toDataURL('image/png');
  link.click();
});

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function login() {
  const pwd = roomPasswordInput.value.trim();
  if (!pwd) { loginError.textContent = 'الرجاء إدخال كلمة المرور'; return; }
  loginBtn.disabled = true;
  loginError.textContent = '';
  try {
    const roomKey = 'room_' + (await sha256(pwd)).slice(0, 20);
    currentRoom = roomKey;
    enterBoard();
  } catch (err) {
    loginError.textContent = 'فشل الدخول';
  } finally {
    loginBtn.disabled = false;
  }
}

function enterBoard() {
  loginPage.style.display = 'none';
  boardPage.classList.add('active');
  resizeCanvases();
  subscribeRoom(currentRoom);
}

function logout() {
  if (unsubShapes) unsubShapes();
  if (unsubPresence) unsubPresence();
  if (presenceRef && userId) {
    remove(ref(db, 'rooms/' + currentRoom + '/presence/' + userId));
  }
  currentRoom = null;
  shapes = [];
  baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  boardPage.classList.remove('active');
  loginPage.style.display = 'flex';
  roomPasswordInput.value = '';
  loginError.textContent = '';
  userCountEl.textContent = '0';
  connDot.className = 'dot';
  connText.textContent = 'جاري الاتصال...';
}

loginBtn.addEventListener('click', login);
roomPasswordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
logoutBtn.addEventListener('click', logout);
drawCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
resizeCanvases();
</script>
</body>
</html>
