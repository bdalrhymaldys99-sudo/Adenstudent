<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#667eea">
<meta name="format-detection" content="telephone=no">
<title>السبورة الحية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖊️</text></svg>">
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    margin: 0; padding: 0;
    -webkit-user-select: none; user-select: none;
  }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #fff; direction: rtl;
    overscroll-behavior: none;
    position: fixed;
    touch-action: none;
  }

  /* ===== شاشة التحميل ===== */
  #splash {
    position: fixed; inset: 0; z-index: 3000;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; transition: opacity 0.4s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== صفحة الدخول (Mobile) ===== */
  #loginPage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    z-index: 2000; padding: 20px;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .login-card {
    background: #fff; border-radius: 24px; padding: 40px 26px; width: 100%; max-width: 420px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.35); text-align: center;
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .login-logo {
    font-size: 60px; margin-bottom: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-card h1 { margin: 0 0 10px; font-size: 28px; color: #2d3436; font-weight: 800; letter-spacing: -0.5px; }
  .login-card p { margin: 0 0 26px; color: #636e72; font-size: 14px; line-height: 1.7; }
  .login-card input {
    width: 100%; padding: 18px 18px; border: 2px solid #e8ecf1; border-radius: 14px;
    font-size: 17px; outline: none; transition: all 0.25s; text-align: center;
    direction: rtl; background: #fafbfc; font-weight: 600;
    -webkit-user-select: text; user-select: text;
  }
  .login-card input:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 4px rgba(102,126,234,0.15); }
  .login-card button {
    width: 100%; margin-top: 16px; padding: 18px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 17px;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.3px; -webkit-appearance: none;
  }
  .login-card button:active { transform: scale(0.97); }
  .login-card button:disabled { opacity: 0.7; }
  #loginError { color: #e74c3c; font-size: 13px; margin-top: 14px; min-height: 20px; font-weight: 600; }

  /* ===== السبورة ===== */
  #boardPage { position: fixed; inset: 0; display: none; background: #fff; }
  #boardPage.active { display: block; }
  #canvasWrap { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; display: block; }

  /* ===== شريط الأدوات — علوي وأفقي (Mobile Friendly) ===== */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 8px 10px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    transition: transform 0.3s, opacity 0.3s;
  }
  #toolbar.hidden { transform: translateY(-110%); opacity: 0; }

  .toolbar-row {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
    padding-bottom: 2px;
  }
  .toolbar-row::-webkit-scrollbar { display: none; }

  .tool-btn {
    flex-shrink: 0;
    width: 48px; height: 48px; border: none; border-radius: 14px;
    background: #f1f3f7; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #2d3436; transition: all 0.15s;
    font-weight: 600; -webkit-appearance: none;
  }
  .tool-btn:active { transform: scale(0.92); background: #e3e7ef; }
  .tool-btn.active {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    box-shadow: 0 4px 15px rgba(102,126,234,0.5);
  }

  .tool-sep { width: 1px; height: 34px; background: #dfe6e9; margin: 0 2px; flex-shrink: 0; }

  #colorPicker {
    flex-shrink: 0;
    width: 48px; height: 48px; border: none; border-radius: 14px;
    cursor: pointer; padding: 0; background: none;
    -webkit-appearance: none; appearance: none;
  }
  #colorPicker::-webkit-color-swatch-wrapper { padding: 4px; }
  #colorPicker::-webkit-color-swatch { border-radius: 10px; border: 2px solid #dfe6e9; }

  .size-wrap {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    background: #f1f3f7; border-radius: 14px; padding: 0 12px;
    height: 48px;
  }
  #sizeSlider {
    width: 110px; accent-color: #667eea; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: transparent; height: 24px;
  }
  #sizeSlider::-webkit-slider-runnable-track {
    height: 6px; background: #dfe6e9; border-radius: 3px;
  }
  #sizeSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin-top: -8px; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(102,126,234,0.5);
  }
  #sizeSlider::-moz-range-track {
    height: 6px; background: #dfe6e9; border-radius: 3px;
  }
  #sizeSlider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: 2px solid #fff;
  }
  #sizeLabel {
    font-size: 13px; font-weight: 700; color: #667eea;
    min-width: 22px; text-align: center;
  }

  /* ===== زر إظهار/إخفاء الشريط — عائم ===== */
  #toggleToolbar {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    left: 10px;
    z-index: 150;
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.08);
    display: none; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    -webkit-appearance: none;
  }
  #toggleToolbar.visible { display: flex; }
  #toggleToolbar:active { transform: scale(0.92); }

  /* ===== شريط الحالة — سفلي ===== */
  #statusBar {
    position: fixed; bottom: 14px; right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    right: calc(14px + env(safe-area-inset-right));
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 14px; padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #2d3436; font-weight: 700;
    box-shadow: 0 6px 25px rgba(0,0,0,0.15);
    z-index: 100;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #b2bec3; transition: all 0.3s; flex-shrink: 0;
  }
  .dot.online { background: #00b894; box-shadow: 0 0 12px #00b894; }
  .dot.connecting { background: #fdcb6e; animation: pulse 1s infinite; }
  .dot.offline { background: #e74c3c; box-shadow: 0 0 12px #e74c3c; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  #userCount { font-weight: 800; color: #667eea; }

  /* ===== زر الخروج — سفلي ===== */
  #logoutBtn {
    position: fixed; bottom: 14px; left: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: calc(14px + env(safe-area-inset-left));
    z-index: 100;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px; padding: 11px 16px;
    color: #e74c3c; font-weight: 700; cursor: pointer;
    font-size: 14px; box-shadow: 0 6px 25px rgba(0,0,0,0.15);
    transition: all 0.2s;
    -webkit-appearance: none;
  }
  #logoutBtn:active { transform: scale(0.95); }

  /* ===== نافذة إدخال النص ===== */
  #textInputModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 2000; padding: 20px;
    backdrop-filter: blur(6px);
  }
  #textInputModal.active { display: flex; animation: fadeIn 0.2s ease; }
  .text-modal-card {
    background: #fff; border-radius: 20px; padding: 26px;
    width: 100%; max-width: 420px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.4);
    animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .text-modal-card h3 { margin: 0 0 16px; color: #2d3436; font-size: 18px; font-weight: 700; }
  .text-modal-card input {
    width: 100%; padding: 16px; border: 2px solid #e8ecf1;
    border-radius: 12px; font-size: 17px; outline: none;
    direction: rtl; background: #fafbfc;
    -webkit-user-select: text; user-select: text;
  }
  .text-modal-card input:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 4px rgba(102,126,234,0.12); }
  .text-modal-card .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .text-modal-card .btn-row button {
    flex: 1; padding: 16px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    -webkit-appearance: none;
  }
  #textConfirm { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  #textConfirm:active { transform: scale(0.97); }
  #textCancel { background: #f1f3f7; color: #2d3436; }
  #textCancel:active { background: #e3e7ef; }

  /* ===== إشعار Toast ===== */
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(45,52,54,0.96); color: #fff;
    padding: 12px 22px; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    z-index: 2500; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    white-space: nowrap; max-width: 90vw;
    overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* منع التحديد */
  .no-select { -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="splash">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <div>جاري التحميل...</div>
  </div>
</div>

<!-- صفحة الدخول -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">🖊️</div>
    <h1>السبورة الحية</h1>
    <p>سبورة بيضاء مشتركة في الوقت الفعلي.<br><strong>كل كلمة مرور تفتح سبورة مستقلة.</strong></p>
    <input type="password" id="roomPassword" placeholder="كلمة مرور السبورة" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button id="loginBtn">دخول</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- السبورة -->
<div id="boardPage">
  <div id="canvasWrap">
    <canvas id="baseCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>

  <button id="toggleToolbar" title="إظهار الشريط">⚙️</button>

  <div id="toolbar">
    <!-- الصف الأول: الأدوات الأساسية -->
    <div class="toolbar-row">
      <button class="tool-btn active" data-tool="pen" title="قلم">✏️</button>
      <button class="tool-btn" data-tool="eraser" title="ممحاة">🧽</button>
      <div class="tool-sep"></div>
      <input type="color" id="colorPicker" value="#2d3436" title="لون" />
      <div class="size-wrap">
        <input type="range" id="sizeSlider" min="1" max="50" value="3" />
        <span id="sizeLabel">3</span>
      </div>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="undoBtn" title="تراجع">↩️</button>
      <button class="tool-btn" id="clearBtn" title="مسح">🗑️</button>
      <button class="tool-btn" id="saveBtn" title="حفظ">💾</button>
    </div>
    <!-- الصف الثاني: الأشكال -->
    <div class="toolbar-row">
      <button class="tool-btn" data-tool="line" title="خط">📏</button>
      <button class="tool-btn" data-tool="rect" title="مستطيل">▭</button>
      <button class="tool-btn" data-tool="circle" title="دائرة">⭕</button>
      <button class="tool-btn" data-tool="arrow" title="سهم">➡️</button>
      <button class="tool-btn" data-tool="text" title="نص">🔤</button>
    </div>
  </div>

  <div id="statusBar">
    <span class="dot" id="connDot"></span>
    <span id="connText">جاري الاتصال...</span>
    <span class="tool-sep"></span>
    <span>👥 <span id="userCount">0</span></span>
  </div>

  <button id="logoutBtn">خروج</button>
</div>

<!-- نافذة النص -->
<div id="textInputModal">
  <div class="text-modal-card">
    <h3>أدخل النص</h3>
    <input type="text" id="textInputField" placeholder="اكتب هنا..." />
    <div class="btn-row">
      <button id="textConfirm">إضافة</button>
      <button id="textCancel">إلغاء</button>
    </div>
  </div>
</div>

<!-- إشعار -->
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, set, onValue, push, remove, onDisconnect,
  serverTimestamp, get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* =========================================================
   ⚙️ إعدادات Firebase
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCQ_mi4RCmP5z86fhdM0xlguisPemXFqJA",
  authDomain: "chatahs-2007.firebaseapp.com",
  databaseURL: "https://chatahs-2007-default-rtdb.firebaseio.com",
  projectId: "chatahs-2007",
  storageBucket: "chatahs-2007.firebasestorage.app",
  messagingSenderId: "901444746249",
  appId: "1:901444746249:web:c7976f39f6ba21c8f88cd8"
};
/* ========================================================= */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const $ = (id) => document.getElementById(id);

// مراجع DOM
const splash = $('splash');
const loginPage = $('loginPage');
const boardPage = $('boardPage');
const roomPasswordInput = $('roomPassword');
const loginBtn = $('loginBtn');
const loginError = $('loginError');
const logoutBtn = $('logoutBtn');
const connDot = $('connDot');
const connText = $('connText');
const userCountEl = $('userCount');
const toggleToolbar = $('toggleToolbar');
const toolbarEl = $('toolbar');
const toastEl = $('toast');
const sizeLabel = $('sizeLabel');

const baseCanvas = $('baseCanvas');
const drawCanvas = $('drawCanvas');
const baseCtx = baseCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

// حالة
let currentRoom = null;
let userId = 'u_' + Math.random().toString(36).slice(2, 12) + '_' + Date.now().toString(36);
let currentTool = 'pen';
let currentColor = '#2d3436';
let currentSize = 3;
let isDrawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let currentPath = [];
let shapes = [];
let unsubShapes = null;
let unsubPresence = null;
let unsubConn = null;
let presenceRef = null;
let roomShapesRef = null;
let textModalResolve = null;
let pendingTextPos = null;
let lastPointAt = 0;
const POINT_THROTTLE = 12;
const MIN_DIST = 1.2;

// ============= Toast =============
let toastTimer = null;
function toast(msg, dur = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
}

// ============= إخفاء شاشة التحميل =============
window.addEventListener('load', () => {
  setTimeout(() => splash.classList.add('hide'), 400);
});

// ============= Canvases =============
function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  for (const c of [baseCanvas, drawCanvas]) {
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  redrawAll();
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvases, 120);
});
window.addEventListener('orientationchange', () => setTimeout(resizeCanvases, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvases, 120);
  });
}

// ============= أدوات =============
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
}
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});
$('colorPicker').addEventListener('input', (e) => { currentColor = e.target.value; });
$('sizeSlider').addEventListener('input', (e) => {
  currentSize = parseInt(e.target.value, 10);
  sizeLabel.textContent = currentSize;
});

// ============= رسم شكل =============
function drawShape(ctx, shape) {
  if (!shape) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = shape.color;
  ctx.fillStyle = shape.color;
  ctx.lineWidth = shape.size;

  try {
    if (shape.tool === 'pen') {
      if (!shape.points || shape.points.length < 2) { ctx.restore(); return; }
      ctx.beginPath();
      ctx.moveTo(shape.points[0].x, shape.points[0].y);
      for (let i = 1; i < shape.points.length; i++) ctx.lineTo(shape.points[i].x, shape.points[i].y);
      ctx.stroke();
    } else if (shape.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = shape.size * 4;
      if (!shape.points || shape.points.length < 2) { ctx.restore(); return; }
      ctx.beginPath();
      ctx.moveTo(shape.points[0].x, shape.points[0].y);
      for (let i = 1; i < shape.points.length; i++) ctx.lineTo(shape.points[i].x, shape.points[i].y);
      ctx.stroke();
    } else if (shape.tool === 'line') {
      ctx.beginPath();
      ctx.moveTo(shape.x1, shape.y1);
      ctx.lineTo(shape.x2, shape.y2);
      ctx.stroke();
    } else if (shape.tool === 'rect') {
      ctx.beginPath();
      ctx.rect(shape.x1, shape.y1, shape.x2 - shape.x1, shape.y2 - shape.y1);
      ctx.stroke();
    } else if (shape.tool === 'circle') {
      const cx = (shape.x1 + shape.x2) / 2;
      const cy = (shape.y1 + shape.y2) / 2;
      const rx = Math.abs(shape.x2 - shape.x1) / 2;
      const ry = Math.abs(shape.y2 - shape.y1) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (shape.tool === 'arrow') {
      const x1 = shape.x1, y1 = shape.y1, x2 = shape.x2, y2 = shape.y2;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = Math.max(16, shape.size * 5);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 7), y2 - headLen * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 7), y2 - headLen * Math.sin(angle + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
    } else if (shape.tool === 'text') {
      ctx.font = `700 ${Math.max(18, shape.size * 7)}px -apple-system, 'Segoe UI', Tahoma, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(shape.text, shape.x1, shape.y1);
    }
  } catch (e) {}
  ctx.restore();
}

function redrawAll() {
  baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
  for (const s of shapes) drawShape(baseCtx, s);
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}

// ============= إحداثيات =============
function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  let cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

// ============= أحداث الرسم =============
function pointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const pos = getPos(e);
  isDrawing = true;
  startX = pos.x; startY = pos.y;
  lastX = pos.x; lastY = pos.y;
  lastPointAt = performance.now();
  if (currentTool === 'pen' || currentTool === 'eraser') {
    currentPath = [{ x: pos.x, y: pos.y }];
  }
}

function pointerMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const now = performance.now();
  if (now - lastPointAt < POINT_THROTTLE) return;
  lastPointAt = now;
  const pos = getPos(e);

  if (currentTool === 'pen' || currentTool === 'eraser') {
    const dx = pos.x - lastX, dy = pos.y - lastY;
    if (dx * dx + dy * dy < MIN_DIST * MIN_DIST) return;
    currentPath.push({ x: pos.x, y: pos.y });

    drawCtx.save();
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    if (currentTool === 'eraser') {
      drawCtx.globalCompositeOperation = 'destination-out';
      drawCtx.lineWidth = currentSize * 4;
    } else {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = currentColor;
      drawCtx.lineWidth = currentSize;
    }
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();
    drawCtx.restore();
    lastX = pos.x; lastY = pos.y;
  } else {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    drawShape(drawCtx, {
      tool: currentTool, color: currentColor, size: currentSize,
      x1: startX, y1: startY, x2: pos.x, y2: pos.y
    });
  }
}

function pointerUp(e) {
  if (!isDrawing) return;
  e.preventDefault();
  isDrawing = false;
  const pos = getPos(e);
  let shape = null;

  if (currentTool === 'pen' || currentTool === 'eraser') {
    if (currentPath.length < 2) {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      currentPath = [];
      return;
    }
    shape = { tool: currentTool, color: currentColor, size: currentSize, points: currentPath };
    currentPath = [];
  } else if (currentTool === 'text') {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    pendingTextPos = { x: startX, y: startY };
    openTextModal();
    return;
  } else {
    const dx = pos.x - startX, dy = pos.y - startY;
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      return;
    }
    shape = {
      tool: currentTool, color: currentColor, size: currentSize,
      x1: startX, y1: startY, x2: pos.x, y2: pos.y
    };
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }

  if (shape) emitShape(shape);
}

// Touch (الأساسي للهواتف)
drawCanvas.addEventListener('touchstart', pointerDown, { passive: false });
drawCanvas.addEventListener('touchmove', pointerMove, { passive: false });
drawCanvas.addEventListener('touchend', pointerUp, { passive: false });
drawCanvas.addEventListener('touchcancel', pointerUp, { passive: false });

// Mouse & Pen للدعم الإضافي
drawCanvas.addEventListener('mousedown', pointerDown);
drawCanvas.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);

drawCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

// منع التكبير بإصبعين على السبورة
drawCanvas.addEventListener('gesturestart', (e) => e.preventDefault());
drawCanvas.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ============= Text Modal =============
function openTextModal() {
  const modal = $('textInputModal');
  const field = $('textInputField');
  field.value = '';
  modal.classList.add('active');
  setTimeout(() => field.focus(), 100);
  textModalResolve = (text) => {
    modal.classList.remove('active');
    if (text && pendingTextPos) {
      emitShape({
        tool: 'text', color: currentColor, size: currentSize,
        x1: pendingTextPos.x, y1: pendingTextPos.y, text
      });
    }
    pendingTextPos = null;
    textModalResolve = null;
  };
}
$('textConfirm').addEventListener('click', () => {
  if (textModalResolve) textModalResolve($('textInputField').value.trim());
});
$('textCancel').addEventListener('click', () => {
  if (textModalResolve) textModalResolve(null);
});
$('textInputField').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (textModalResolve) textModalResolve($('textInputField').value.trim());
  }
});

// ============= إرسال شكل =============
function emitShape(shape) {
  if (!roomShapesRef) return;
  // رسم محلي فوري
  shapes.push(shape);
  drawShape(baseCtx, shape);
  // إرسال للخادم
  const newRef = push(roomShapesRef);
  set(newRef, { ...shape, ts: serverTimestamp(), by: userId });
}

// ============= الاشتراك بالغرفة =============
function subscribeRoom(roomKey) {
  roomShapesRef = ref(db, 'rooms/' + roomKey + '/shapes');
  presenceRef = ref(db, 'rooms/' + roomKey + '/presence');

  // تحميل الحالة الأولية
  get(roomShapesRef).then((snap) => {
    const val = snap.val() || {};
    const arr = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    shapes = arr.map(s => { const { ts, by, ...rest } = s; return rest; });
    redrawAll();
  }).catch(err => console.warn('load err', err));

  // الاستماع للتغييرات اللحظية
  unsubShapes = onValue(roomShapesRef, (snap) => {
    const val = snap.val() || {};
    const arr = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const newShapes = arr.map(s => { const { ts, by, ...rest } = s; return rest; });

    // إذا نفس العدد ونفس المحتوى -> تجاهل
    if (newShapes.length === shapes.length) {
      let same = true;
      for (let i = 0; i < newShapes.length; i++) {
        if (JSON.stringify(newShapes[i]) !== JSON.stringify(shapes[i])) { same = false; break; }
      }
      if (same) return;
    }
    shapes = newShapes;
    redrawAll();
  });

  // الحضور
  const myPresenceRef = ref(db, 'rooms/' + roomKey + '/presence/' + userId);
  set(myPresenceRef, { online: true, ts: serverTimestamp() });
  onDisconnect(myPresenceRef).remove();

  unsubPresence = onValue(presenceRef, (snap) => {
    const val = snap.val() || {};
    let count = 0;
    for (const k in val) if (val[k] && val[k].online) count++;
    userCountEl.textContent = count;
  });

  // حالة الاتصال
  const connectedRef = ref(db, '.info/connected');
  unsubConn = onValue(connectedRef, (snap) => {
    if (snap.val() === true) {
      connDot.className = 'dot online';
      connText.textContent = 'متصل';
      set(myPresenceRef, { online: true, ts: serverTimestamp() });
      onDisconnect(myPresenceRef).remove();
    } else {
      connDot.className = 'dot connecting';
      connText.textContent = 'إعادة الاتصال...';
    }
  });
}

// ============= التراجع =============
$('undoBtn').addEventListener('click', () => {
  if (!roomShapesRef) return;
  get(roomShapesRef).then((snap) => {
    const val = snap.val() || {};
    const entries = Object.entries(val).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
    if (entries.length === 0) { toast('لا يوجد شيء للتراجع'); return; }
    const lastKey = entries[entries.length - 1][0];
    remove(ref(db, 'rooms/' + currentRoom + '/shapes/' + lastKey));
  });
});

// ============= مسح الكل =============
$('clearBtn').addEventListener('click', () => {
  if (!roomShapesRef) return;
  if (!confirm('هل تريد مسح السبورة بالكامل؟')) return;
  shapes = [];
  redrawAll();
  set(roomShapesRef, null);
  toast('تم مسح السبورة');
});

// ============= حفظ PNG =============
$('saveBtn').addEventListener('click', () => {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const tmp = document.createElement('canvas');
  tmp.width = Math.floor(w * dpr);
  tmp.height = Math.floor(h * dpr);
  const tctx = tmp.getContext('2d');
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.fillStyle = '#fff';
  tctx.fillRect(0, 0, w, h);
  tctx.drawImage(baseCanvas, 0, 0, w, h);
  tctx.drawImage(drawCanvas, 0, 0, w, h);
  const link = document.createElement('a');
  link.download = 'board-' + Date.now() + '.png';
  link.href = tmp.toDataURL('image/png');
  link.click();
  toast('تم حفظ الصورة');
});

// ============= إخفاء/إظهار الشريط =============
let toolbarHidden = false;
toggleToolbar.addEventListener('click', () => {
  toolbarHidden = !toolbarHidden;
  toolbarEl.classList.toggle('hidden', toolbarHidden);
  toggleToolbar.classList.toggle('visible', toolbarHidden);
});

// ============= Hash كلمة المرور =============
async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============= الدخول =============
async function login() {
  const pwd = roomPasswordInput.value.trim();
  if (!pwd) { loginError.textContent = 'الرجاء إدخال كلمة المرور'; return; }
  loginBtn.disabled = true;
  loginError.textContent = '';
  try {
    const roomKey = 'room_' + (await sha256(pwd)).slice(0, 20);
    currentRoom = roomKey;
    enterBoard();
  } catch (err) {
    loginError.textContent = 'فشل الدخول، حاول مجددًا';
    console.error(err);
  } finally {
    loginBtn.disabled = false;
  }
}

function enterBoard() {
  loginPage.style.display = 'none';
  boardPage.classList.add('active');
  setTimeout(() => resizeCanvases(), 50);
  subscribeRoom(currentRoom);
  // إخفاء الشريط تلقائيًا بعد 5 ثوانٍ
  setTimeout(() => {
    if (!toolbarHidden) {
      toolbarHidden = true;
      toolbarEl.classList.add('hidden');
      toggleToolbar.classList.add('visible');
    }
  }, 5000);
}

// ============= الخروج =============
function logout() {
  if (!confirm('هل تريد الخروج من السبورة؟')) return;
  if (unsubShapes) unsubShapes();
  if (unsubPresence) unsubPresence();
  if (unsubConn) unsubConn();
  if (presenceRef && currentRoom) {
    remove(ref(db, 'rooms/' + currentRoom + '/presence/' + userId));
  }
  currentRoom = null;
  shapes = [];
  baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  boardPage.classList.remove('active');
  loginPage.style.display = 'flex';
  roomPasswordInput.value = '';
  loginError.textContent = '';
  userCountEl.textContent = '0';
  connDot.className = 'dot';
  connText.textContent = 'جاري الاتصال...';
  toolbarHidden = false;
  toolbarEl.classList.remove('hidden');
  toggleToolbar.classList.remove('visible');
}

// ============= ربط الأحداث =============
loginBtn.addEventListener('click', login);
roomPasswordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
logoutBtn.addEventListener('click', logout);

// ============= منع السلوك الافتراضي =============
window.addEventListener('contextmenu', (e) => {
  if (boardPage.classList.contains('active')) e.preventDefault();
});
document.addEventListener('touchmove', (e) => {
  if (e.target === document.body || e.target === document.documentElement) {
    e.preventDefault();
  }
}, { passive: false });
</script>
</body>
</html>
